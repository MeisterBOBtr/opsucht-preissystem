name: Build OPSUCHT Inventarwert

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android NDK und CMake installieren
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: CMake konfigurieren
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Build
        run: cmake --build build --target opsucht_inventarwert -j2

      - name: Paket als ZIP erstellen
        run: |
          mkdir -p dist
          cp build/out/libopsucht_inventarwert.so dist/
          cd dist
          zip -r ../Opsucht-Inventarwert-Schritt-1.zip .

      - name: Build-Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Opsucht-Inventarwert-Schritt-1
          path: |
            Opsucht-Inventarwert-Schritt-1.zip
            build/out/libopsucht_inventarwert.so
          if-no-files-found: error
