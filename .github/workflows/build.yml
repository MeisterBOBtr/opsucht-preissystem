name: Build OPVANTIS - Diagnose Dauerpanel Test 16

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmake;3.22.1"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Clone LeviLauncher template
        run: |
          git clone --depth 1 \
            https://github.com/QYCottage/levilauncher-android-mod-template.git \
            template

      - name: Clone BedrockTools
        run: |
          git clone --depth 1 \
            https://github.com/QYCottage/BedrockTools.git \
            bedrocktools

      - name: Clone EnTT
        run: |
          git clone --depth 1 \
            --branch v3.16.0 \
            https://github.com/skypjack/entt.git \
            entt

      - name: Prepare dependencies
        run: |
          rm -rf template/src/bedrocktools
          rm -rf template/src/entt
          mkdir -p template/src
          cp -r bedrocktools/include/bedrocktools template/src/
          cp -r entt/single_include/entt template/src/
          test -f template/src/entt/entt.hpp

      - name: Copy OPVANTIS source
        run: |
          test -f src/main.cpp
          cp src/main.cpp template/src/main.cpp

      - name: Configure mod information
        working-directory: template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("CMakeLists.txt")
          s = p.read_text()

          s = s.replace("GIT_TAG 0.2.2", "GIT_TAG main")
          s = s.replace("GIT_TAG 0.2.3", "GIT_TAG main")

          replacements = {
              'set(MOD_ID "clange_me" CACHE STRING':
                  'set(MOD_ID "opvantis" CACHE STRING',
              'set(MOD_NAME "Clange Me Mod" CACHE STRING':
                  'set(MOD_NAME "OPVANTIS" CACHE STRING',
              'set(MOD_AUTHOR "clange_me" CACHE STRING':
                  'set(MOD_AUTHOR "MeisterBOBtr" CACHE STRING',
              'set(MOD_LIBRARY_NAME "clange_me" CACHE STRING':
                  'set(MOD_LIBRARY_NAME "opvantis" CACHE STRING',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Build LeviPack
        working-directory: template
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          pwsh ./scripts/package.ps1 -Abi arm64-v8a

      - name: Locate LeviPack
        id: find_pack
        if: success()
        run: |
          echo "Suche nach erzeugten .levipack-Dateien..."

          find template -type f -name "*.levipack" -print

          PACK="$(find template -type f -name "*.levipack" -print -quit)"

          if [ -z "$PACK" ]; then
            echo "Keine .levipack-Datei gefunden."
            echo "Dateien im Template:"
            find template -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Gefundene Datei: $PACK"
          echo "path=$PACK" >> "$GITHUB_OUTPUT"

      - name: Upload OPVANTIS Diagnose Test 16
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OPVANTIS-Diagnose-Dauerpanel-Test16
          path: ${{ steps.find_pack.outputs.path }}
          if-no-files-found: error
